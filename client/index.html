<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ground &amp; Grain — Coffee Shop</title>
    <meta
      name="description"
      content="Order coffee, tea and fresh pastries from Ground & Grain. Browse the menu and collect at the counter."
    />
    <meta name="theme-color" content="#FBF6EC" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2392400E'/%3E%3Cpath d='M9 12h11v7a4 4 0 0 1-4 4h-3a4 4 0 0 1-4-4v-7Z' fill='%23FBF6EC'/%3E%3Cpath d='M20 13h1.5a2.5 2.5 0 0 1 0 5H20' stroke='%23FBF6EC' stroke-width='1.6' fill='none'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <script>
      // Set the theme before first paint so there is no light flash.
      try {
        var stored = localStorage.getItem('ground-grain.theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
